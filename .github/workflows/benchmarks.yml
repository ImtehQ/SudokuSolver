name: Sudoku Benchmarks

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benchmark-results
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate project
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi
          python3 -m unittest scripts.update_benchmark_readme_test
          go vet ./...
          go test ./...
      - name: Build benchmark binary
        run: |
          mkdir -p .benchmark
          go build -trimpath -o .benchmark/sudokusolver ./cmd/sudokusolver
      - name: Run four Sudoku benchmarks
        run: |
          python3 scripts/update_benchmark_readme.py \
            --binary .benchmark/sudokusolver \
            --results-json benchmark-results.json \
            --results-svg benchmark-results.svg \
            --timeout 300
      - name: Upload detailed benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-benchmark-results
          path: |
            benchmark-results.json
            benchmark-results.svg
          if-no-files-found: error
      - name: Publish live README benchmark graphic
        env:
          RESULTS_BRANCH: benchmark-results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$RESULTS_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$RESULTS_BRANCH:$RESULTS_BRANCH"
          else
            git branch "$RESULTS_BRANCH"
          fi

          git worktree add .benchmark-publish "$RESULTS_BRANCH"
          cp benchmark-results.svg .benchmark-publish/benchmark-results.svg
          cp benchmark-results.json .benchmark-publish/benchmark-results.json
          cd .benchmark-publish
          git add benchmark-results.svg benchmark-results.json

          if git diff --cached --quiet; then
            echo "Published benchmark results are already current."
            exit 0
          fi

          git commit -m "Update Sudoku benchmark results for ${GITHUB_SHA::12}"
          git push origin "$RESULTS_BRANCH"
