name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version such as 0.1.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Refuse to reuse a release version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists. Bump VERSION before merging another release."
            exit 1
          fi
      - name: Validate
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Build standalone binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="sudokusolver_${VERSION}_${os}_${arch}"
            mkdir -p "build/$name"
            binary="sudokusolver"
            if [ "$os" = "windows" ]; then binary="sudokusolver.exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA}" \
              -o "build/$name/$binary" ./cmd/sudokusolver
            cp README.md "build/$name/README.md"
            if [ "$os" = "windows" ]; then
              (cd build && zip -qr "../dist/${name}.zip" "$name")
            else
              tar -C build -czf "dist/${name}.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Smoke-test Linux build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          binary="build/sudokusolver_${VERSION}_linux_amd64/sudokusolver"
          "$binary" --version | grep "SudokuSolver ${VERSION}"
          "$binary" --trials 20 --seed 7 --verify \
            "530070000600195000098000060800060003400803001700020006060000280000419005000080079" \
            | grep "Exact solvability: yes"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "SudokuSolver $TAG" \
            --generate-notes
